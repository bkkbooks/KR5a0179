front:
  text: 三洞衆戒文卷上下同卷
  hash: sha256:51603e8647718eb3149bfc644b0f18b21da5b102428a7bd804eec06c8b1a77cd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0179_HFL_001-001a, image: hfl/0077/0077-040.png}
body:
  text: 始起心入道三歸戒文出太玄部元始天尊告太上大道君曰夫道寞而無也動而有也布氣行神衆兆生也抱一含元虛無空寂文應象成包真吐精稟識作狀回黃化青乘機赴會緣感物情吾故告汝塞耳心聽道者衆物祖首至無生神造化天地日月山川流精散氣無所不之逺而莫極邇難得窮大無不包細無不入經緯宇宙潤洽毛髮守之清虛悟之神明淡泊不渝躁聒勿譁常在不亡虛通無閡載劫詎易永世為範可以保神可以守身可以治國可以得仙道經師者衆常通也抑惡舉善戒人天也身神命者生妙寶也回元轉化根聖真也身權假也精構氣凝歸於虛寂神附託也道行生存歸於常命自來也飲食呼吸歸於衆罪福緣對善惡吉凶從之興群形生化變幻浮虛不可保久歸之於道經師若赤子歸母衆物依地不可須臾失戒天不用此道不能運行地不用此道不能載植日月不用此道不能明照隂陽不用此道不能生化鬼神不用此道不能徹視君長不用此道不能治理道士不用此道戒不能常在三道神妙長生可守太上大道君稽首上白天尊曰願以此道教諸天人於是燌百和寶香奏鈞天廣樂衆真散花諸天齊到命諸男女伏受三歸依戒第一戒者歸身太上無極大道第二戒者歸神三十六部尊經第三戒者歸命玄中大法師天尊曰三歸戒者天地之樞紐神仙之根祗發行之初門建心之元兆運氣啓靈𡨋真入理包羅有象聯形無外持之者天地神明慶快心智耳目開張萬物敬畏六府和樂衆真衛護群生父母長世不遺人神交泰弟子奉師科戒文弟子别師經月皆冠帶執簡問訊不得白服弟子别師經宿皆禮拜長跪還亦如之弟子不得向師稱弟子言皆稱名弟子詣師不得專輒而坐命坐方坐弟子不得喚師作道士皆云家師弟子不得犯師名諱若人問不止下聲答之弟子不得唐突師左右皆有司察之官弟子見師有過失當於深隱處長跪諌之不得在人前言師是非醜鄙弟子與師言不得髙聲大語弟子與師共室不得先卧在後起弟子與師同食不得在師前食聽在前止弟子問訊師皆當隨其所受髙下巾褐執簡不得趣爾白服弟子隨師起居行止皆當謙卑恭敬不得斯須無敬弟子事師師年少弟子年髙弟子皆應恭敬譬如官長二千石父母同等不得自恃高貴輕忽於師其關不小具在明真科弟子與師同在席坐師若起動行止弟子即須倚立不得安然端坐弟子先未受法戒或氣類齊等或復耆年或是姓從兄弟子孫後諸師受法皆須謙卑恭敬言皆稱名不得比常弟子與師親服緦麻者皆不得相為師所以爾者受法皆證三曽七祖父母來監臨子孫所受若違盟九祖受考殃及受法之身弟子不得忿嫉責怒師主及懷恨在心罪科具出明真經弟子詣師請道法皆當冠帶執簡謙苦求請不得趣爾弟子與師别經年月朔皆冠帶執簡禮三拜長跪問訊訖復再拜合成五拜别亦如之明各識焉弟子不得與師爭口忽忽哂意弟子事師皆當恭敬不得傲慢無禮罰在明真經中宜各慎之弟子不得與師爭竸功名無有推讓之心弟子詣師當請問所受不得論及私鄙弟子事師師若逺行還弟子皆當隨路逺近奉迎不得端坐晏然待師至弟子與師同行不得踐師影慎之弟子與師共在座不得受人跪拜所以爾者座無二尊弟子不得隂行橫勃忿鬪師主弟子若出入及所營作每先咨問於師不得自專弟子事師皆當恩愛信實不得猶豫二心弟子不得𥨸盜發泄師器笈中犯師禁戒科律得罪弟子不得背叛師主慎之具在明真經文弟子與師同處不得洟唾左右慎之弟子侍從師若值賔客弟子侍衛師左右不得髙抗大坐與凡俗無别皆入不孝慎之弟子受師法業後玄德成就為人所宗皆當謙下存憶本師勿忘先恩也弟子事師不得輒坐師牀席處所神司之禁也右弟子奉師科戒合三十六條三洞衆戒文卷上
