body:
  text: 第一戒者目無廣瞻亂諸華色亡睛失明光不朗徹第二戒者耳無亂聽混於五音傷神敗正惡聲啼吟第三戒者鼻無廣嗅雜炁臭腥易有混濁形不澄正第四戒者口無貪味脂薰之屬濁注五神藏府憤潰第五戒者手無犯惡不竊人物貪利入已禍不自覺第六戒者心無愛欲搖動五神傷精喪炁體發迷荒天尊言其六戒者身之大患來生男女雖受人形而六情不純未見經教不聞法音形不自覺沉迷罪門致令短促不竟天年長處惡道甚可哀憐故說是戒開度天人善心信向一意歸命尊奉聖教閉諸惡門則形入虛空六通智慧六情恬夷神自甯也炁自和也精自固也夀命長遠終不亡也萬福曰六情者染罪之門喪身之源也所以持戒先制六情六情恬夷神道歸也故學士初入中乘先須閉塞六情然後漸階于道故以爲次達者詳之矣經曰凡學妙精玄變神化大道眾術當潔已清齋誦習清戒洞曉義趣動靜通神勤行善道謹密妙事諦在功過勿生謬妄心識明定戒業又全然後行道應心如口不能修此人鬼亂壞滅已誤他爲道兼濟濟物安已愼勿戲弄以道誇人又勿害他以利於己當持此戒以制之也第一戒者諦識因緣勿忘本逐末第二戒者諦守少私勿利我損物第三戒者諦習勤行勿混俗失眞右三上戒上皇所行上帝所奉上士所修修行奉持全而不破三炁正神降與爲一身神又一一無二焉得道常存號曰太上不行此戒服佩符文勞而無驗非太上弟子也經云帝昊英吿黃帝曰吾受太上老君眾經要戒勤行之報得有今日法應流布勸化將來不得閉塞杜絕後生子心精鍊方與長生宜廣宣戒以成兼濟之功矣黃帝稽首再拜奉旨遵行第一戒者目不貪五色誓止殺學長生第二戒者耳不貪五音願聞善從無惑第三戒者鼻不貪五炁用法香遣俗穢第四戒者口不貪五味習胎息絕惡言第五戒者身不貪五綵履勤勞以順道右五戒五老帝君各遣二十五神防護受持者身免脫災害延年夀命安國寧家救度一切受授之時依如三戒法三戒招玄元始三炁五戒延仁禮信義智五炁三五爲八周有遍無鍊而精之洪纖畢備太上曰凡諸戒律通應共行其間緩急繁簡高卑各有意義准儀玄元變化生數階漸相成三五八九十百千萬雖隨緣所堪亦不可越略知迴向正法修長生不死三五已參宜受八戒第一星解五行備修五德第二習五事不可無恒第三平理八正行藏順時第四明識五紀與炁同存第五精審皇極上下相和第六修三德期會三清第七決定疑惑化僞爲眞第八考校徵驗消禍降福鍊凡登聖無負三尊右八戒持之必全犯破即謝首悔責躬改意革心堅防後失行之三年八方善神僉來擁護六年保免六極六極者凶禍短折常多疾苦恒懷憂慮積苦貧乏形容醜惡尫弱無施也八年永享五福五福者長夀富貴康寍好德考終鍊有入無自識宿命也九年神通超凡成聖矣經曰志學之士才力未强多知爲敗怠墮致殃善行教者照其所堪隨品稍㖟悱憤日新且閉繁科示以要訣眾經諸法漸次修行功德成就自然遍通通由要起要訣有三一者曰因無始中來仍有識性性靈無滅死苦尚存生樂無機關不識因者定不怨天不尤人不咎物不慼身苦樂是甘無妄惑也二者曰緣因循動靜内外取和不侵人益身不陷已誤物損而無傷利而無害識本知末無邪疑也三者曰勤謹愼心口嚴勑身神聞聖尋請受教遵承增廣善緣斷絕惡因正見子精進無退不違師自任不漫信浮隨不驕怠亂羣不苟執干眾不藏眞出僞不有始無終也右久憶此訣三度人濟已三皇神吏自然見形爲之使役通達眞靈鍊凡成聖變麄爲精不知此三終不得道經曰齋以齊整爲急急以齊整身心身心齊整保無亂敗敗起多端大略有八一者殺生自活二者盜他自供三者淫欲爲快四者妄語誑人五者醉酒恣意六者雜臥高廣大床七者競翫香油華飾八者躭著歌舞作唱右八者大人君子學聖眞仙不爲此八事則八敗無從起八敗無起則八成自然立立則不失延年保命神通洞達思眞行道明驗必速也天皇曰第一之要先求長生第二之要當求藏形第三之要當避世榮仙人曰夫欲延夀長生避諸禁忌如左禁無施精命夭沒禁無大食炁脉閉禁無大飲膀胱急禁無大温消髓骨禁無大寒傷肌肉禁無寒食生病結禁無欬唾失肌汁禁無久視令目䁾禁無久聽聰明閉禁無久泣神悲慼禁無卒呼驚魂魄禁無内念志恍惚禁無恚怒神不樂經曰七百二十門要戒律文諸天寶秘佩身傳口不書經中若未遇其師當服符取應見神來降仍請受之凡人從无始中來有識在心心識浮動迴易須臾駟馬過隙比之遲也雲間迅電亦非速也心之善惡反覆無常一切諸急莫若心之疾也心之難持甚於虎豹猴猿鹿馬皆易制也一切之中心難馭也善能調御心者其唯上聖之人乎中下聖眞恒與心爭晝夜俯仰内省外觀常恐越逸損滅心神神散不可追還身殞豈得重立立身不殞養神不散長生神仙位登上聖要在清齋齋各有品五情六欲縱橫競興内外參差致生迷亂背正向邪棄本逐末欺負幽明招考沉淪九泉之府楚掠萬端解脫無期由於不齋故也志學之士急務修齋齋直齊心守戒爲主主以制心心定則生忘戒失主心亂則死死中求生生求不死悉當清齋誦習行戒情欲既多戒遂無量無量法門眾聖開設趣引群生使之能入各有方所諸天不同時有行藏歷世舛異大略不殊一切所共七百二十門最爲妙勝持之全者入道究竟故能變化七十四方九天各八八九七十二爰上及下合七十四方不能持戒或持之不全各隨階品變化不同變化不同則不免累患是故上聖令持之矣一切含生皆有三五又有多少愚智不同更相領攝抑揚相緣一識旣動無端競興守一不可直指三五交互扶持三炁流行八會相輔太一遊厯九宫相成一源爲本九化爲末有本有末九一居宗宗本引末末同還源源一應末末感旣動本應恆寂寂應諸動動名外來外來曰動内住曰寂寂動於半有異有同同動以救去異寂以濟來來不驚寂去不勞動動而不勞不離寂也寂而不驚不疑動也寂照明徹故無驚疑動以徐生故無勞隔無勞隔者常合長生無驚疑者長樂常住住無所住爲而無爲爲道之最用本一焉分化成數八九迴旋相乘積門七百二十也門者文也理也還也散逸應還還修由文得門能入未歸源也本因麄多增緣精少少多相傾補續相涉識悟轉開見門稍審長善勇猛詣𨶢速臻臻未速者經屚無央大略變化捨故即新駭聽殊觀正在七百二十門中積厯八九究鍊畢竟七百二十共爲一矣守一勿失行一難堅念念相仍不可暫替暫替則邪干邪干則正翳正翳則門塞門塞則見迷迷者陷苦苦極思迴識神感發超然醒悟更堅其念念念相續因積積久一炁浹身身神通徹八九朗然變化無窮由悟守一守一須資唯戒爲急持之不虧邪不得入邪不得入正炁相親親密久之自然混合與道同眞資戒果遂由戒入道故謂爲門精志之儔諦從之耳萬福曰夫人心不一識有暗明妙道無方神化難測心明則悟道神昧則迷眞而心以寂明神由動亂亂則失道明乃會眞故守正除邪則妄心不起背明向暗乃惡念斯生善否非他諒自身造迷悟在己亦不由人是以大聖天尊弘慈化物善權方便接引無遺廣設法門招提一切隨宜授藥眾病消除普勸行人悉令持戒戒有多種大小異門究竟歸根同成正道但三五六八漸頓稍殊識悟既明終持一戒一戒者唯戒於心不起他念也即此戒謂守一勿失念念相仍是也學士當諦思行之矣
